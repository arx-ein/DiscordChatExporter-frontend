daemon off;

worker_processes  1;

# These paths (DCEF_DIR) are substituted with absolute values at runtime by RUN_DEV.sh
pid        DCEF_DIR/_temp/nginx/nginx.pid;
error_log  DCEF_DIR/logs/nginx-dev-error.log;

events {
    worker_connections  1024;
}

http {
    include       DCEF_DIR/dcef/backend/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  off;

    sendfile        on;
    keepalive_timeout  65;

    expires -1;

    server {
        listen       21012;
        server_name  localhost;

        autoindex off;

        location /api/ {
            rewrite           ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:58001/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
        }

        location /input/ {
            # Will be substituted with absolute values at runtime by RUN_DEV.sh
            alias   EXPORTS_DIR/;

            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # proxy vite HMR websocket
        location / {
            proxy_pass http://localhost:5050;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }
    }
}
