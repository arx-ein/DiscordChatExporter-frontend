daemon off;

worker_processes  1;

# These paths (DCEF_DIR) are substituted with absolute values at runtime by dcef.sh
pid        DCEF_DIR/_temp/nginx/nginx.pid;
error_log  DCEF_DIR/logs/nginx-error.log;

events {
    worker_connections  1024;
}

http {
    include       DCEF_DIR/dcef/backend/nginx/conf/mime.types;
    default_type  application/octet-stream;

    access_log  DCEF_DIR/logs/nginx-access.log;

    sendfile        on;
    keepalive_timeout  65;

    expires -1;

    server {
        listen       21011;
        server_name  localhost;

        autoindex off;

        location /api/ {
            rewrite           ^/api/(.*) /$1 break;
            proxy_pass http://127.0.0.1:58000/;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
        }

        location /input/ {
            alias   DCEF_DIR/exports/;

            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location / {
            root   DCEF_DIR/dcef/frontend/;
        }
    }
}
